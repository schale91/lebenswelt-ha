name: Lebenswelt Datenbank
version: "0.17.0"
slug: lebenswelt
description: Datenbank und Schnittstelle für die Lebenswelt-App (PocketBase hinter dem Ingress von Home Assistant)
url: https://github.com/schale91/lebenswelt-ha
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8090
ingress_panel: false
panel_icon: mdi:island
# SQLite wird nur im gestoppten Zustand gesichert, damit das Backup in sich stimmig ist.
backup: cold
# Für den Garmin-Abgleich: liest Zustände aus Home Assistant (nur lesend genutzt).
homeassistant_api: true
# Selbst-Update der App: schreibt neue Versionen nach www/lebenswelt-*/ (nur Ordner mit server.json).
map:
  - type: homeassistant_config
    read_only: false
options:
  person: ""
  vertraute_apps:
    - 81f33d0f-ha-mcp
  fitness_personen: []
  garmin_sensor: sensor.garmin_connect_last_activities
  wetter_entitaet: weather.forecast_home
  app_quelle: schale91/Claude@app-paket
  app_token: ""
  fcm_dienstkonto: ""
  ais_schluessel: ""
  ais_radius_km: 5
  ha_benachrichtigung: ""
schema:
  person: str?
  vertraute_apps:
    - str
  fitness_personen:
    - str
  garmin_sensor: str?
  wetter_entitaet: str?
  app_quelle: str?
  app_token: password?
  fcm_dienstkonto: password?
  ais_schluessel: password?
  ais_radius_km: int(1,20)?
  ha_benachrichtigung: str?
