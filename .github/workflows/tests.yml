# Prüfung jeder Änderung am Add-on: Node-Tests der Hooks, Regelwerk, Schiffsempfang und eine Startprobe in der echten
# PocketBase (Version wie im Dockerfile). Die Ende-zu-Ende-Tests mit der App laufen im App-Repository, weil es privat ist;
# Ablauf für Add-on-Änderungen in docs/ARBEITSABLAUF.md, Abschnitt „Ende-zu-Ende-Tests“.
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node-Tests der Hooks
        run: node --test test/*.test.js
      - name: Regelwerk
        run: node werkzeuge/pruefe-regelwerk.js
      - name: Schiffsempfang
        run: python3 test/ais_test.py
      - name: PocketBase laden (Version aus dem Dockerfile)
        run: |
          v=$(sed -n 's/^ARG PB_VERSION=//p' lebenswelt/Dockerfile)
          mkdir -p "$RUNNER_TEMP/pocketbase"
          curl -fsSL -o "$RUNNER_TEMP/pocketbase.zip" "https://github.com/pocketbase/pocketbase/releases/download/v${v}/pocketbase_${v}_linux_amd64.zip"
          unzip -q -o "$RUNNER_TEMP/pocketbase.zip" pocketbase -d "$RUNNER_TEMP/pocketbase"
          "$RUNNER_TEMP/pocketbase/pocketbase" --version
      - name: Startprobe (Hooks laden, Migrationen laufen, Routen antworten)
        run: POCKETBASE="$RUNNER_TEMP/pocketbase/pocketbase" node werkzeuge/pruefe-start.js
